[env:cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino

board_build.embed_files =
    data/normal.jpg
    data/blink.jpg

upload_protocol = esptool
upload_speed = 460800
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_ldf_mode = deep+

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -Wall
    -Wextra

build_unflags =
    -std=gnu++11

lib_deps =
    m5stack/M5CoreS3@1.0.1
    m5stack/M5Unified@0.2.19
